<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b3a8f" />
      <stop offset="100%" stop-color="#4a78c6" />
    </linearGradient>
  </defs>
  <!-- Architectural Monolith Foundation -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#08090b" stroke="#0b3a8f" stroke-width="2.5" />
  
  <!-- Architectural Top-Left Slash (Hero .sl motif) -->
  <polygon points="2,2 24,2 12,16 2,16" fill="url(#accentGrad)" />
  
  <!-- Signature Cobalt Celestial Circle (Hero .ci motif) -->
  <circle cx="49" cy="15" r="5.5" fill="#4a78c6" />
  
  <!-- Monogram: S / A crafted in heavy geometric brutalist style -->
  <text x="32" y="42" fill="#f4f4f2" font-family="'Montserrat', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="24" letter-spacing="-1.5" text-anchor="middle">S/A</text>
  
  <!-- Elevation Rail Base Accent -->
  <rect x="18" y="49" width="28" height="3.5" rx="1.75" fill="#0b3a8f" />
</svg>
